<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CamperPower · Stroom in je camper, zonder giswerk</title>
    <meta
      name="description"
      content="Bereken welke accu, zonnepanelen en laders je camper nodig heeft. Onafhankelijk, met Nederlandse zondata, een stuklijst en veiligheidschecks."
    />
    <meta name="theme-color" content="#F6F0E4" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="nl_NL" />
    <meta property="og:site_name" content="CamperPower" />
    <meta property="og:title" content="CamperPower · Stroom in je camper, zonder giswerk" />
    <meta
      property="og:description"
      content="Bereken welke accu, zonnepanelen en laders je camper nodig heeft. Met Nederlandse zondata, een stuklijst en veiligheidschecks."
    />
    <meta property="og:image" content="https://camperpower.vercel.app/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="CamperPower: een crème camper in een bergweide bij gouden licht" />
    <script>
      try {
        var path = location.pathname
        if (path === '/en' || path.indexOf('/en/') === 0) {
          document.documentElement.lang = 'en'
          var ogLocale = document.querySelector('meta[property="og:locale"]')
          if (ogLocale) ogLocale.setAttribute('content', 'en_GB')
        }
        var t = localStorage.getItem('camperpower.theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
        var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#14110C')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p lang="nl">CamperPower heeft JavaScript nodig om te rekenen. Zet JavaScript aan om de configurator te gebruiken.</p>
      <p lang="en">CamperPower needs JavaScript to do the sums. Turn JavaScript on to use the configurator.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
